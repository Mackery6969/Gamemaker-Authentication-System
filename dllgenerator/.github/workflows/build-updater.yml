name: build-updater

on:
  push:
    branches: [main]
    paths:
      - 'dllgenerator/updater/**'
      - '.github/workflows/build-updater.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build updater.exe
        shell: powershell
        run: |
          ./dllgenerator/updater/build.ps1
          if ($LASTEXITCODE -ne 0) { throw "updater.exe build failed" }

      - name: Upload updater.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-exe
          path: dllgenerator/updater/updater.exe
          retention-days: 30
