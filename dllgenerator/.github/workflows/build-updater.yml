name: build-updater

on:
  push:
    branches: [main]
    paths:
      - 'dllgenerator/updater/**'
      - '.github/workflows/build-updater.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Build updater.exe
        shell: powershell
        run: |
          ./dllgenerator/updater/build.ps1
          if ($LASTEXITCODE -ne 0) { throw "updater.exe build failed" }

      - name: Upload updater.exe artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: updater-exe
          path: dllgenerator/updater/updater.exe
          retention-days: 30
